name: Capturar evidências da issue 72

on:
  push:
    branches:
      - feature/72-mensagens-erro-por-campo
    paths:
      - .github/workflows/evidencias-72.yml

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capturar os dois estados reais do formulário
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/vite-72.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium, expect } from '@playwright/test';
          import { mkdir, writeFile } from 'node:fs/promises';
          const directory = 'docs/evidencias/72';
          await mkdir(directory, { recursive: true });
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport: { width: 1280, height: 960 }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:4173/');
            await page.getByRole('link', { name: 'Cadastro', exact: true }).click();
            await page.getByRole('button', { name: 'Validar dados' }).click();
            const nome = page.getByLabel('Nome do local');
            await expect(nome).toBeFocused();
            await expect(nome).toHaveAccessibleDescription('Informe o nome do local.');
            for (const label of ['Nome do local', 'Categoria', 'Endereço', 'Descrição']) {
              await expect(page.getByLabel(label)).toHaveAttribute('aria-invalid', 'true');
            }
            const form = page.locator('section[aria-labelledby="titulo-cadastro"]');
            await form.screenshot({ path: directory + '/cadastro-erros.png' });
            await nome.fill('Biblioteca Central');
            await expect(nome).not.toHaveAttribute('aria-invalid');
            await expect(page.getByText('Informe o nome do local.', { exact: true })).toHaveCount(0);
            for (const label of ['Categoria', 'Endereço', 'Descrição']) {
              await expect(page.getByLabel(label)).toHaveAttribute('aria-invalid', 'true');
            }
            await form.screenshot({ path: directory + '/cadastro-campo-corrigido.png' });
            const metadata = [
              '# Evidências visuais da issue #72', '',
              'Capturas reais do formulário em Chromium, geradas automaticamente com Playwright.',
              'Commit executado: ' + process.env.GITHUB_SHA,
              'Execução: https://github.com/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID, '',
              '## Formulário vazio', '',
              'Ao acionar Validar dados, os quatro campos mostram mensagens específicas e o foco vai para Nome do local.', '',
              '![Quatro erros do cadastro](cadastro-erros.png)', '',
              '## Correção de um campo', '',
              'Após preencher Biblioteca Central, o erro do nome desaparece. Os outros três erros permanecem.', '',
              '![Nome corrigido e outros três erros mantidos](cadastro-campo-corrigido.png)', '',
              'O cadastro apenas valida dados; a persistência depende da futura API.',
              'Captura automatizada com assistência do Codex. Revisão técnica e QA independente permanecem pendentes.', ''
            ].join('\n');
            await writeFile(directory + '/README.md', metadata);
            console.log('Dois cenários verificados e duas capturas PNG geradas.');
          } finally {
            await browser.close();
          }
          NODE
      - name: Publicar somente as evidências na branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidencias/72
          git commit -m "docs: adiciona capturas reais da validação por campo"
          git push origin HEAD:feature/72-mensagens-erro-por-campo
